ssil poetry. As the limestone", "kinds": ["score"]}, {"line": "of the continent consists of infinite masses of", "kinds": ["score"]}, {"line": "the shells of animalcules, so language is made", "kinds": ["score"]}, {"line": "up of images, or tropes, which now, in their", "kinds": ["score"]}, {"line": "secondary use, have long ceased to remind us", "kinds": ["score"]}, {"line": "of their poetic origin. But the poet names", "kinds": ["score"]}, {"line": "the thing because he sees it, or comes one step", "kinds": ["score"]}, {"line": "nearer to it than any other. This expression,", "kinds": ["score"]}, {"note": "This is admirable, as many other thoughts of Mr. Emerson's are. His gross and astonishing errors & illusions spring from a self-conceit so intensely intellectual and calm that at first one hesitates to call it by its right name. Another species of Mr Emerson's"}]}, {"head": "The Poet, page 29", "scan": "https://melvillesmarginalia.org/Viewer.aspx?did=68&pid=24070", "flow": [{"line": "quickly learns, that, beyond the energy of his", "kinds": ["score"]}, {"line": "possessed and conscious intellect, he is capable", "kinds": ["score"]}, {"line": "of a new energy (as of an intellect doubled", "kinds": ["score"]}, {"line": "on itself), by abandonment to the nature of", "kinds": ["score"]}, {"line": "things; that, beside his privacy of power as an", "kinds": ["score"]}, {"line": "individual man, there is a great public power,", "kinds": ["score"]}, {"line": "on which he can draw, by unlocking, at all", "kinds": ["score"]}, {"line": "risks, his human doors, and suffering the", "kinds": ["score"]}, {"line": "ethereal tides to roll and circulate through", "kinds": ["score"]}, {"line": "him: then he is caught up into the life of the", "kinds": ["score"]}, {"line": "Universe, his speech is thunder, his thought is", "kinds": ["score"]}, {"line": "law, and his words are universally intelligible", "kinds": ["score"]}, {"line": "as the plants and animals. The poet knows", "kinds": ["score"]}, {"line": "that he speaks adequately, then, only when he", "kinds": ["score"]}, {"line": "speaks somewhat wildly, or, \"with the flower", "kinds": ["score"]}, {"line": "of the mind:\" not with the intellect, used as", "kinds": ["score"]}, {"line": "an organ, but with the intellect released from", "kinds": ["score"]}, {"gap": true}, {"line": "throws his reins on his horse's neck, and trusts", "kinds": ["score"]}, {"line": "to the nectar. As instinct the of the traveller who animal to has find lost his his road, way,", "kinds": ["score"]}, {"line": "so must we do with the divine animal who", "kinds": ["score"]}, {"line": "carries us through this world. For if in any", "kinds": ["score"]}, {"note": "This is an original application of the thought."}]}, {"head": "The Poet, page 31", "scan": "https://melvillesmarginalia.org/Viewer.aspx?did=68&pid=24072", "flow": [{"line": "poets, musicians, and actors, have been more", "kinds": ["score"]}, {"line": "than others wont to lead a life of pleasure and", "kinds": ["score"]}, {"line": "indulgence; all but the few who received", "kinds": ["score"]}, {"line": "the true nectar; and, as it was a spurious", "kinds": ["score"]}, {"line": "mode of attaining freedom, as it was an emancipation", "kinds": ["score"]}, {"line": "not into the heavens, but into the", "kinds": ["score"]}, {"line": "freedom of baser places, they were punished", "kinds": ["score"]}, {"line": "for that advantage they won, by a dissipation", "kinds": ["score"]}, {"line": "and deterioration. But never can any advantage", "kinds": ["score"]}, {"line": "be taken of nature by a trick. The", "kinds": ["score"]}, {"note": "No, no, no.— Titian— did he deteriorate?— Byron?— did he. —Mr E. is horribly narrow here. He has his Dardenelles for his every Marmora. —But he keeps nobly on, for all that!"}]}, {"head": "The Poet, page 32", "scan": "https://melvillesmarginalia.org/Viewer.aspx?did=68&pid=24073", "flow": [{"line": "So the poet's habit of living should be set on", "kinds": ["score"]}, {"line": "a key so low and plain, that the common influences", "kinds": ["score"]}, {"line": "should delight him. His cheerfulness", "kinds": ["score"]}, {"line": "should be the gift of the sunlight; the air", "kinds": ["score"]}, {"line": "should suffice for his inspiration, and he should", "kinds": ["score"]}, {"line": "be tipsy with water. That spirit which suffices", "kinds": ["score"]}, {"line": "quiet hearts, which seems to come forth", "kinds": ["score"]}, {"line": "to such from every dry knoll of sere grass,", "kinds": ["score"]}, {"line": "from every pine-stump, and half-imbedded", "kinds": ["score"]}, {"note": "This makes the Wordsworthian poet— not the Shakespearean."}]}, {"head": "The Poet, page 34", "scan": "https://melvillesmarginalia.org/Viewer.aspx?did=68&pid=24075", "flow": [{"line": "are animals; or affirms a man to be a heavenly", "kinds": ["score"]}, {"line": "tree, growing with his root, which is his head,", "kinds": ["score"]}, {"line": "upward; and, as George Chapman, following", "kinds": ["score"]}, {"line": "him, writes,—", "kinds": ["score"]}, {"gap": true}, {"line": "\"So in our tree of man, whose nervie root", "kinds": ["score"]}, {"line": "Springs in his top;\"", "kinds": ["score"]}, {"line": "when Orpheus speaks of hoariness as \"that", "kinds": ["score"]}, {"line": "white flower which marks extreme old age;\"", "kinds": ["score"]}, {"line": "when Proclus calls the universe the statue of", "kinds": ["score", "underline"]}, {"line": "the intellect; when Chaucer, in his praise", "kinds": ["score", "underline"]}, {"line": "of 'Gentilesse,' compares good blood in mean", "kinds": ["score"]}, {"line": "condition to fire, which, though carried to the", "kinds": ["score"]}, {"line": "darkest house betwixt this and the mount of", "kinds": ["score"]}, {"line": "Caucasus, will yet hold its natural office, and", "kinds": ["score"]}, {"line": "burn as bright as if twenty thousand men did", "kinds": ["score"]}, {"line": "it behold; when John saw, in the apocalypse,", "kinds": ["score"]}, {"line": "the ruin of the world through evil, and the stars", "kinds": ["score"]}, {"line": "fall from heaven, as the figtree casteth her untimely", "kinds": ["score"]}, {"line": "fruit; when Aesop reports the whole", "kinds": ["score"]}, {"line": "catalogue of common daily relations through", "kinds": ["score"]}, {"line": "the masquerade of birds and beasts;— we", "kinds": ["score"]}, {"line": "take the cheerful hint of the immortality of", "kinds": ["score"]}, {"line": "our essence, and its versatile habit and escapes,", "kinds": ["score"]}, {"line": "as when the gypsies say, \"it is in vain to hang", "kinds": ["score"]}, {"line": "them, they cannot die.\"", "kinds": ["score"]}, {"note": "All this is nobly written, and proceeds from noble thinking, and a natural sympathy with greatness."}]}], "titlePage": [["xl wide", "ESSAYS:"], ["gap"], ["m", "SECOND SERIES."], ["xs", "BY"], ["m wide", "R. W. EMERSON."], ["gap"], ["orn"], ["push"], ["m wide", "BOSTON:"], ["s wide", "JAMES MUNROE AND COMPANY."], ["rule"], ["xs", "MDCCCXLIV."], ["pencil", "1844"]], "look": {"cloth": "#34473b", "grain": "pebble", "height": 19, "thick": 2.9, "bands": [0.09, 0.4, 0.53, 0.65, 0.77, 0.89], "gilt": [[0.18, [["EMERSON’S", "m"], ["ESSAYS", "l"], ["SECOND SERIES", "s"], ["", "rule"], ["THIRD EDITION", "s"]]], [0.95, [["Munroe & Co", "it"]]]]}, "group": "emerson", "shelf": 1, "historical": true, "annotationColor": "#777163", "annotationInk": "#4e3829"}, {"id": "melville-wikipedia", "title": "Herman Melville", "author": "Wikipedia contributors", "look": {"kind": "modern", "cloth": "#e5e4db", "ink": "#304d64"}, "openOnPassage": true, "contents": true, "startLabel": "Wikipedia article", "titlePage": [["xs wide", "A GUIDE TO THE READER"], ["gap", ""], ["xl", "Herman Melville"], ["m", "Wikipedia"], ["rule", ""], ["s", "Life, work, and the ideas that remain."]], "credit": {"text": "Text by Wikipedia contributors. Reflowed for this reader; illustrations, citations and reference lists omitted.", "links": [{"href": "https://en.wikipedia.org/wiki/Herman_Melville", "label": "Full article"}, {"href": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674&action=history", "label": "Contributors"}, {"href": "https://creativecommons.org/licenses/by-sa/4.0/", "label": "CC BY-SA 4.0"}]}, "provenance": {"source": "https://en.wikipedia.org/wiki/Herman_Melville", "revision": 1378125674, "retrieved": "2026-10-18", "license": "CC BY-SA 4.0", "omittedFrom": "Selected bibliography"}, "pages": [{"origin": "wikipedia", "head": "A life in brief", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Herman Melville (born Melvill; August 1, 1819 – September 28, 1891) was an American writer of the American Renaissance period. Among his best-known works are Moby-Dick (1851), Typee (1846), a romanticized account of his experiences in Polynesia, and Billy Budd, Sailor, a posthumously published novella. At the time of his death, Melville was not well known to the public, but 1919, the centennial of his birth, was the starting point of a Melville revival. Moby-Dick would eventually be considered one of the Great American Novels.", "kinds": ["paragraph"]}, {"line": "Melville was born in New York City, the third child of a prosperous merchant whose death in 1832 left the family in dire financial straits. He took to the sea in 1839 as a common sailor on the merchant ship St. Lawrence and then in 1841, on the whaler Acushnet. However, he jumped ship in the Marquesas Islands. Typee, his first book, and its sequel, Omoo (1847), were travel adventures based on his encounters with the peoples of the islands. Their success gave him the financial security to marry Elizabeth Shaw, the daughter of Boston jurist Lemuel Shaw. Mardi (1849), a romance adventure and his first book not based on his own experience, was not well received. Redburn (1849) and White-Jacket (1850), both tales based on his experience as a well-born young man at sea, were given respectable reviews, but did not sell well enough to support his expanding family.", "kinds": ["paragraph"]}, {"line": "Melville's growing literary ambition showed in Moby-Dick (1851), which took nearly a year and a half to write, but it did not find an audience, and critics scorned his psychological novel Pierre: or, The Ambiguities (1852). From 1853 to 1856, Melville published short fiction in magazines, including \"Benito Cereno\" and \"Bartleby, the Scrivener\". In 1857, he traveled to England, toured the Near East, and published his last work of prose, The Confidence-Man (1857). He moved to New York City in 1863, eventually taking a position as a United States customs inspector.", "kinds": ["paragraph"]}, {"line": "From that point, Melville focused his creative powers on poetry. Battle-Pieces and Aspects of the War (1866) was his poetic reflection on the moral questions of the American Civil War. In 1867, his eldest child Malcolm died at home from a self-inflicted gunshot. Melville's metaphysical epic Clarel: A Poem and Pilgrimage in the Holy Land was published in 1876. In 1886, his other son Stanwix died of apparent tuberculosis, and Melville retired. During his last years, he privately published two volumes of poetry, and left one volume unpublished. The novella Billy Budd was left unfinished at the time of his death, but was published posthumously in 1924. Melville died from cardiovascular disease in 1891.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Early life and education", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Early_life_and_education", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Herman Melville was born in New York City, on August 1, 1819, the third of eight children to Allan Melvill and Maria (Gansevoort) Melvill. His seven siblings, who played important roles in his career and emotional life, were Gansevoort, Helen Maria, Augusta, Allan, Catherine, Frances Priscilla, and Thomas, who eventually became a governor of Sailors' Snug Harbor. Part of a well-established and colorful Boston family, Allan Melvill spent considerable time away from New York City, travelling regularly to Europe as a commission merchant and an importer of French dry goods.", "kinds": ["paragraph"]}, {"line": "Both of Melville's grandfathers played significant roles in the American Revolutionary War, and Melville later expressed satisfaction in his \"double revolutionary descent\". Major Thomas Melvill participated in the Boston Tea Party, and Melville's maternal grandfather, General Peter Gansevoort, commanded the defense of Fort Stanwix in New York in 1777.", "kinds": ["paragraph"]}, {"line": "At the turn of the 19th century, Major Melvill did not send his son Allan (Herman's father) to college, but instead sent him to France, where he spent two years in Paris and learned to speak French fluently. In 1814, Allan, who subscribed to his father's Unitarianism, married Maria Gansevoort, who was committed to her family's more strict and biblically oriented Dutch Reformed version of the Calvinist creed. The Gansevoorts' severe Protestantism ensured that Maria was well versed in the Bible, in English as well as in Dutch, the language that the Gansevoorts spoke at home.", "kinds": ["paragraph"]}, {"line": "On August 19, almost three weeks after his birth, Melville was baptized at home by a minister of the South Reformed Dutch Church. During the 1820s, Melville lived a privileged and opulent life in a household supported by three or more servants at a time. Every four years, the family moved to more spacious and elegant quarters, finally settling on Broadway in 1828. Allan Melvill lived beyond his means, on large sums that he borrowed from his father and from his wife's widowed mother. Although his wife's opinion of his financial conduct is unknown, biographer Hershel Parker says that Maria \"thought her mother's money was infinite and that she was entitled to much of her portion\" while her children were young. How well the parents managed to hide the truth from their children is \"impossible to know\", according to biographer Andrew Delbanco.", "kinds": ["paragraph"]}, {"line": "In 1830, the Gansevoorts ended their financial support of the Melvilles, at which point Allan's lack of financial responsibility had left him in debt to both the Melvill and Gansevoort families for a sum exceeding $20,000 (equivalent to $605,000 in 2025). But Melville biographer Newton Arvin writes that the relative happiness and comfort of Melville's early childhood depended less on Allan's wealth and profligate spending than on the \"exceptionally tender and affectionate spirit in all the family relationships, especially in the immediate circle\". Arvin describes Allan as \"a man of real sensibility and a particularly warm and loving father,\" while Maria was \"warmly maternal, simple, robust, and affectionately devoted to her husband and her brood\".", "kinds": ["paragraph"]}, {"line": "Melville's education began when he was six. In 1824, the Melvilles moved to a newly built house at 33 Bleecker Street in Manhattan. In 1825, Herman and his brother Gansevoort enrolled in New York Male High School. In 1826, the year that Herman contracted scarlet fever, Allan Melvill described him as \"very backwards in speech & somewhat slow in comprehension\" at first, but his development increased its pace and Allan was surprised \"that Herman proved the best Speaker in the introductory Department\". In 1829, both Gansevoort and Herman transferred to Columbia Grammar and Preparatory School, and Herman enrolled in the English Department on September 28. \"Herman I think is making more progress than formerly,\" Allan wrote in May 1830 to Major Melvill, \"and without being a bright Scholar, he maintains a respectable standing, and would proceed further, if he could only be induced to study more—being a most amiable and innocent child, I cannot find it in my heart to coerce him\".", "kinds": ["paragraph"]}, {"line": "Emotionally unstable and behind on paying the rent for the house on Broadway, Herman's father tried to recover by moving his family to Albany, New York, in 1830 and going into the fur business. Herman attended The Albany Academy from October 1830 to October 1831, where he took the standard preparatory course, including reading and spelling, penmanship, arithmetic, English grammar, geography, natural history, universal, Greek, Roman, and English history, classical biography, and Jewish antiquities. In early August 1831, Herman marched in the Albany city government procession of the year's \"finest scholars\" and was presented with a copy of The London Carcanet, a collection of poems and prose, inscribed to him as \"first best in ciphering books\". As Melville scholar Merton Sealts observed,", "kinds": ["paragraph"]}, {"line": "The ubiquitous classical references in Melville's published writings suggest that his study of ancient history, biography, and literature during his school days left a lasting impression on both his thought and his art, as did his almost encyclopedic knowledge of both the Old and the New Testaments.", "kinds": ["paragraph"]}, {"line": "In October 1831, Melville left the Academy. While the precise reason is not known definitively, Parker speculates it was for financial reasons, since \"even the tiny tuition fee seemed too much to pay\".", "kinds": ["paragraph"]}, {"line": "In December 1831, Allan Melvill returned from New York City by steamboat, but he had to travel the last 70 miles in an open carriage for two days and two nights in subfreezing temperatures. In early January, he began to show \"signs of delirium\", and he grew worse until his wife felt that his suffering deprived him of his intellect. On January 28, 1832, he died, two months prior to reaching his 50th birthday. Since Herman was no longer attending school, he likely witnessed his father's medical and mental deterioration. Twenty years later, Melville described a similar death in Pierre.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Work as a clerk", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Work_as_a_clerk", "scanLabel": "Wikipedia ↗", "flow": [{"line": "The death of Allan caused many major shifts in the family's material and spiritual circumstances. One result was the greater influence of his mother's religious beliefs. Maria sought consolation in her faith and in April was admitted as a member of the First Reformed Dutch Church. Herman's saturation in orthodox Calvinism was surely the most decisive intellectual and spiritual influence of his early life.", "kinds": ["paragraph"]}, {"line": "Two months after his father's death, Gansevoort entered the cap and fur business. Uncle Peter Gansevoort, a director of the New York State Bank, got Herman a job as clerk for $150 a year (equivalent to $4,800 in 2025). Biographers cite a passage from Redburn when trying to answer what Herman must have felt then: \"I had learned to think much and bitterly before my time,\" the narrator remarks, adding, \"I must not think of those delightful days, before my father became a bankrupt ... and we removed from the city; for when I think of those days, something rises up in my throat and almost strangles me\". With Melville, Arvin argues, one has to reckon with \"psychology, the tormented psychology, of the decayed patrician\".", "kinds": ["paragraph"]}, {"line": "When Melville's paternal grandfather died on September 16, 1832, Maria and her children discovered Allan, somewhat unscrupulously, had borrowed more than his share of his inheritance, meaning Maria received only $20 (equivalent to $600 in 2025). His paternal grandmother died almost exactly seven months later. Melville did his job well at the bank; although he was only 14 in 1834, the bank considered him competent enough to be sent to Schenectady, New York, on an errand. Not much else is known from this period except that he was very fond of drawing. The visual arts became a lifelong interest. Around May 1834, the Melvilles moved to another house in Albany, a three-story brick house. That same month a fire destroyed Gansevoort's skin-preparing factory, which left him with personnel he could neither employ nor afford. Instead he pulled Melville out of the bank to man the cap and fur store.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Intermittent work and studies", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Intermittent_work_and_studies", "scanLabel": "Wikipedia ↗", "flow": [{"line": "In 1835, while still working in the store, Melville enrolled in Albany Classical School, perhaps using Maria's part of the proceeds from the sale of the estate of his maternal grandmother in March 1835. In September of the following year, Herman was back at The Albany Academy, participating in the school's Latin course. He also participated in debating societies, in an apparent effort to make up as much as he could for his missed years of schooling. During this time, he read Shakespeare, including Macbeth, whose witch scenes gave him the chance to teasingly scare his sisters. By March 1837, however, he again withdrew from The Albany Academy.", "kinds": ["paragraph"]}, {"line": "Gansevoort served as a role model and support for Melville throughout his life, particularly during this time trying to cobble together an education. In early 1834, Gansevoort became a member of Albany's Young Men's Association for Mutual Improvement, and in January 1835 Melville joined him there. Gansevoort also had copies of John Todd's Index Rerum, a blank register for indexing remarkable passages from books one had read for easy retrieval. Among the sample entries that Gansevoort made showing his academic scrupulousness was \"Pequot, beautiful description of the war with,\" with a short title reference to the place in Benjamin Trumbull's A Complete History of Connecticut (Volume I in 1797, and Volume II in 1818) in which the description could be found. The two surviving volumes of Gansevoort's are the best evidence for Melville's reading in this period. Gansevoort's entries include books Melville used for Moby-Dick and Clarel, including \"Parsees—of India—an excellent description of their character, and religion and an account of their descent—East India Sketch Book p. 21\". Other entries are on Panther, the pirate's cabin, and storm at sea from James Fenimore Cooper's The Red Rover.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Work as a school teacher", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Work_as_a_school_teacher", "scanLabel": "Wikipedia ↗", "flow": [{"line": "The Panic of 1837 forced Gansevoort to file for bankruptcy in April. In June, Maria told the younger children they needed to leave Albany for somewhere cheaper. Gansevoort began studying law in New York City while Herman managed the farm before getting a teaching position at Sikes District School near Lenox, Massachusetts. He taught about 30 students of various ages, including some his own age.", "kinds": ["paragraph"]}, {"line": "The semester over, he returned to his mother in 1838. In February he was elected president of the Philo Logos Society, which Peter Gansevoort invited to move into Stanwix Hall for no rent. In the Albany Microscope in March, Melville published two polemical letters about issues in vogue in the debating societies. Historians Leon Howard and Hershel Parker suggest the motive behind the letters was a youthful desire to have his rhetorical skills publicly recognized. In May, the Melvilles moved to a rented house in Lansingburgh, almost 12 miles north of Albany. Nothing is known about what Melville did or where he went for several months after he finished teaching at Sikes. On November 12, five days after arriving in Lansingburgh, Melville paid for a term at Lansingburgh Academy to study surveying and engineering. In an April 1839 letter recommending Herman for a job in the Engineer Department of the Erie Canal, Peter Gansevoort says his nephew \"possesses the ambition to make himself useful in a business which he desires to make his profession,\" but no job resulted.", "kinds": ["paragraph"]}, {"line": "Just weeks after this failure, Melville's first known published essay appeared. Using the initials \"L.A.V.\", Herman contributed \"Fragments from a Writing Desk\" to the weekly newspaper Democratic Press and Lansingburgh Advertiser, which printed it in two installments, the first on May 4. According to Merton Sealts, his use of heavy-handed allusions reveals familiarity with the work of William Shakespeare, John Milton, Walter Scott, Richard Brinsley Sheridan, Edmund Burke, Samuel Taylor Coleridge, Lord Byron, and Thomas Moore. Parker calls the piece \"characteristic Melvillean mood-stuff\" and considers its style \"excessive enough [...] to indulge his extravagances and just enough overdone to allow him to deny that he was taking his style seriously\". For Delbanco, the style is \"overheated in the manner of Poe, with sexually charged echoes of Byron and The Arabian Nights\".", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1839–1844: Years at sea", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1839%E2%80%931844%3A_Years_at_sea", "scanLabel": "Wikipedia ↗", "flow": [{"line": "On May 31, 1839, Gansevoort, then living in New York City, wrote that he was sure Herman could get a job on a whaler or merchant vessel. The next day, he signed aboard the merchant ship St. Lawrence as a \"boy\" (a green hand), which cruised from New York to Liverpool. Redburn: His First Voyage (1849) draws on his experiences in this journey; at least two of the nine guide-books listed in chapter 30 of the book had been part of Allan Melvill's library. He arrived back in New York October 1, 1839 and resumed teaching, now at Greenbush, New York, but left after one term because he had not been paid. In the summer of 1840 he and his friend James Murdock Fly went to Galena, Illinois, to see if his Uncle Thomas could help them find work. Unsuccessful, he and his friend returned home in autumn, likely by way of St. Louis and up the Ohio River.", "kinds": ["paragraph"]}, {"line": "Inspired by seafaring stories, including Richard Henry Dana Jr.'s new book Two Years Before the Mast and Jeremiah N. Reynolds's account in the May 1839 issue of The Knickerbocker magazine of the hunt for a great white sperm whale named Mocha Dick, Herman and Gansevoort traveled to New Bedford, where Herman signed up for a whaling voyage aboard a new ship, the Acushnet. Built in 1840, the ship measured some 104 feet in length, almost 28 feet (8.5 m) in breadth, and almost 14 feet in depth. She measured slightly less than 360 tons and had two decks and three masts, but no quarter galleries. The Acushnet was owned by Melvin O. Bradford and Philemon Fuller of Fairhaven, Massachusetts, and was berthed near their office at the foot of Center Street in that town. Herman signed a contract on Christmas Day with the ship's agent as a \"green hand\" for 1/175th of whatever profits the voyage would yield. On Sunday the 27th, the brothers heard Reverend Enoch Mudge preach at the Seamen's Bethel on Johnnycake Hill, where white marble cenotaphs on the walls memorialized local sailors who had died at sea, often in battle with whales. When he signed the crew list the next day, Herman was advanced $84.", "kinds": ["paragraph"]}, {"line": "On January 3, 1841, the Acushnet set sail. Melville slept with some twenty others in the forecastle; Captain Valentine Pease, the mates, and the skilled men slept aft. Whales were found near The Bahamas, and in March 150 barrels of oil were sent home from Rio de Janeiro. Cutting in and trying-out (boiling) a single whale took about three days, and a whale yielded approximately one barrel of oil per foot of length and per ton of weight (the average whale weighed 40 to 60 tons). The oil was kept on deck for a day to cool off, and was then stowed down; scrubbing the deck completed the labor. An average voyage meant that some forty whales were killed to yield some 1600 barrels of oil.", "kinds": ["paragraph"]}, {"line": "On April 15, the Acushnet sailed around Cape Horn and traveled to the South Pacific, where the crew sighted whales without catching any. She then went up the coast of Chile to the region of Selkirk Island, and on May 7, near Juan Fernández Islands, she had 160 barrels. On June 23, the ship anchored for the first time since Rio, in Santa Harbor. The cruising grounds the Acushnet was sailing attracted much traffic, and Captain Pease not only paused to visit other whalers, but at times hunted in company with them. From July 23 into August, the Acushnet regularly gammed with the Lima from Nantucket, and Melville met William Henry Chase, the son of Owen Chase, who gave him a copy of his father's account of his adventures aboard the Essex. Ten years later, Melville wrote in his other copy of the book: \"The reading of this wondrous story upon the landless sea, & close to the very latitude of the shipwreck had a surprising effect upon me\".", "kinds": ["paragraph"]}, {"line": "On September 25, the ship reported having 600 barrels of oil to another whaler, and in October 700 barrels. On October 24, the Acushnet crossed the equator to the north, and six or seven days later arrived at the Galápagos Islands. This short visit would be the basis for \"The Encantadas\". On November 2, the Acushnet and three other American whalers were hunting together near the Galápagos Islands; Melville later exaggerated that number in Sketch Fourth of \"The Encantadas\". From November 19 to 25, the ship anchored at Chatham's Isle, and on December 2 reached the coast of Peru and anchored at Tumbes, near Paita, with 570 barrels of oil on board. On December 27, the Acushnet sighted Cape Blanco, off Ecuador. Point St. Elena was sighted the next day, and on January 6, 1842, the ship approached the Galápagos Islands from the southeast. From February 13 to May 7, seven sightings of sperm whales were recorded, but none were killed. From early May to early June, the Acushnet cooperatively set about its whaling endeavors several times with the Columbus of New Bedford, which also took letters from Melville's ship; the two ships were in the same area just south of the Equator. On June 16, the Acushnet carried 750 barrels of oil and sent home 200 on the Herald the Second, and, on June 23, she reached the Marquesas Islands and anchored at Nuku Hiva.", "kinds": ["paragraph"]}, {"line": "In the summer of 1842, Melville and his shipmate Richard Tobias Greene (\"Toby\") jumped ship at Nuku Hiva Bay. Melville's first book, Typee (1846), is based on his stay in or near the Taipi Valley. By around mid-August, Melville had left the island aboard the Australian whaler Lucy Ann, bound for Tahiti, where he took part in a mutiny and was briefly jailed in the native Calabooza Beretanee. In October, he and crew mate John B. Troy escaped Tahiti for Eimeo. He then spent a month as beachcomber and island rover (\"omoo\" in Tahitian), eventually crossing over to Moorea. He drew on these experiences for Omoo, the sequel to Typee. In November, he contracted to be a seaman on the Nantucket whaler Charles & Henry for a six-month cruise (November 1842 – April 1843), and was discharged at Lahaina, Maui, in the Hawaiian Islands, in May 1843.", "kinds": ["paragraph"]}, {"line": "After four months of working several jobs in Hawaii, including as a clerk, Melville joined the U.S. Navy on August 20, as an ordinary seaman on the frigate USS United States. During the next year, the homeward bound ship visited the Marquesas Islands, Tahiti, and Valparaiso, and then, from summer to fall 1844, Mazatlan, Lima, and Rio de Janeiro, before reaching Boston on October 3. Melville was discharged on October 14. This Navy experience is used in White-Jacket (1850), Melville's fifth book.", "kinds": ["paragraph"]}, {"line": "Melville's wander-years created what biographer Arvin calls \"a settled hatred of external authority, a lust for personal freedom\", and a \"growing and intensifying sense of his own exceptionalism as a person\", along with \"the resentful sense that circumstance and mankind together had already imposed their will upon him in a series of injurious ways\". Scholar Robert Milder believes the encounter with the wide ocean, where he was seemingly abandoned by God, led Melville to experience a \"metaphysical estrangement\" and influenced his social views in two ways: first, that he belonged to the genteel classes, but sympathized with the \"disinherited commons\" he had been placed among and, second, that experiencing the cultures of Polynesia let him view the West from an outsider's perspective.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1845–1850: Successful writer", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1845%E2%80%931850%3A_Successful_writer", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Upon his return, Melville regaled his family and friends with his adventurous tales and romantic experiences, and they urged him to put them into writing. Melville completed Typee, his first book, in the summer of 1845 while living in Troy, New York. His brother Gansevoort found a publisher for it in London, where it was published in February 1846 by John Murray in his travel adventure series. It became an overnight bestseller in England, then in New York, when it was published on March 17 by Wiley & Putnam.", "kinds": ["paragraph"]}, {"line": "In the narrative, Melville likely extended the period of time he had spent on the island and also incorporated material from source books he had assembled. Milder calls Typee \"an appealing mixture of adventure, anecdote, ethnography, and social criticism presented with a genial latitudinarianism that gave novelty to a South Sea idyll at once erotically suggestive and romantically chaste\".", "kinds": ["paragraph"]}, {"line": "An unsigned review in the Salem Advertiser written by Nathaniel Hawthorne called the book a \"skilfully managed\" narrative by an author with \"that freedom of view ... which renders him tolerant of codes of morals that may be little in accordance with our own\". Hawthorne continued: This book is lightly but vigorously written; and we are acquainted with no work that gives a freer and more effective picture of barbarian life, in that unadulterated state of which there are now so few specimens remaining. The gentleness of disposition that seems akin to the delicious climate, is shown in contrast with the traits of savage fierceness...He has that freedom of view—it would be too harsh to call it laxity of principle—which renders him tolerant of codes of morals that may be little in accordance with our own, a spirit proper enough to a young and adventurous sailor, and which makes his book the more wholesome to our staid landsmen.", "kinds": ["paragraph"]}, {"line": "Pleased but not overwhelmed by the adulation of his new public, Melville later expressed concern that he would \"go down to posterity ... as a 'man who lived among the cannibals'!\" The writing of Typee brought Melville back into contact with his friend Greene—Toby in the book—who wrote confirming Melville's account in newspapers. The two corresponded until 1863, and in his final years Melville \"traced and successfully located his old friend\" for a further meeting of the two. In March 1847, Omoo, a sequel to Typee, was published by Murray in London, and in May by Harper in New York. Omoo is \"a slighter but more professional book,\" according to Milder. Typee and Omoo gave Melville overnight renown as a writer and adventurer, and he often entertained by telling stories to his admirers. As the writer and editor Nathaniel Parker Willis wrote, \"With his cigar and his Spanish eyes, he talks Typee and Omoo, just as you find the flow of his delightful mind on paper\".", "kinds": ["paragraph"]}, {"line": "In 1847, Melville tried unsuccessfully to find a \"government job\" in Washington.", "kinds": ["paragraph"]}, {"line": "In June 1847, Melville and Elizabeth \"Lizzie\" Knapp Shaw were engaged, after knowing each other for approximately three months. Melville had first asked her father, Lemuel Shaw, for her hand in March, but was turned down at the time. Shaw, Chief Justice of Massachusetts, had been a close friend of Melville's father, and Shaw's marriage with Melville's aunt Nancy was prevented only by her death. His warmth and financial support for the family continued after Allan's death. Melville dedicated his first book, Typee, to him. Lizzie was raised by her grandmother and an Irish nurse. Arvin suggests that Melville's interest in Lizzie may have been stimulated by \"his need of Judge Shaw's paternal presence\". They were married on August 4, 1847. Lizzie described their marriage as \"very unexpected, and scarcely thought of until about two months before it actually took place\". She wanted to be married in church, but they had a private wedding ceremony at home to avoid possible crowds hoping to see the celebrity. The couple honeymooned in the then-British Province of Canada, and traveled to Montreal. They settled in a house on Fourth Avenue in New York City (now called Park Avenue).", "kinds": ["paragraph"]}, {"line": "According to scholars Joyce Deveau Kennedy and Frederick James Kennedy, Lizzie brought to their marriage a sense of religious obligation, an intent to make a home with Melville regardless of place, a willingness to please her husband by performing such \"tasks of drudgery\" as mending stockings, an ability to hide her agitation, and a desire \"to shield Melville from unpleasantness\". The Kennedys conclude that \"If the ensuing years did bring regrets to Melville's life, it is impossible to believe he would have regretted marrying Elizabeth. In fact, he must have realized that he could not have borne the weight of those years unaided—that without her loyalty, intelligence, and affection, his own wild imagination would have had no \"port or haven\".", "kinds": ["paragraph"]}, {"line": "Biographer Robertson-Lorant cites \"Lizzie's adventurous spirit and abundant energy,\" and she suggests that \"her pluck and good humor might have been what attracted Melville to her, and vice versa\". An example of such good humor appears in a letter about her not yet used to being married: \"It seems sometimes exactly as if I were here for a visit. The illusion is quite dispelled however when Herman stalks into my room without even the ceremony of knocking, bringing me perhaps a button to sew on, or some equally romantic occupation\". On February 16, 1849, the Melvilles' first child, Malcolm, was born.", "kinds": ["paragraph"]}, {"line": "In March 1848, Mardi was published by Richard Bentley in London, and in April by Harper in New York. Nathaniel Hawthorne thought it a rich book \"with depths here and there that compel a man to swim for his life\". According to Milder, the book began as another South Sea story but, as he wrote, Melville left that genre behind, first in favor of \"a romance of the narrator Taji and the lost maiden Yillah,\" and then \"to an allegorical voyage of the philosopher Babbalanja and his companions through the imaginary archipelago of Mardi\".", "kinds": ["paragraph"]}, {"line": "In October 1849, Redburn was published by Bentley in London, and in November by Harper in New York. The bankruptcy and death of Allan Melvill, and Melville's own youthful humiliations, surface in this \"story of outward adaptation and inner impairment\". Biographer Robertson-Lorant regards the work as a deliberate attempt for popular appeal: \"Melville modeled each episode almost systematically on every genre that was popular with some group of antebellum readers,\" combining elements of \"the picaresque novel, the travelogue, the nautical adventure, the sentimental novel, the sensational French romance, the gothic thriller, temperance tracts, urban reform literature, and the English pastoral\". His next novel, White-Jacket, was published by Bentley in London in January 1850, and in March by Harper in New York.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1850–1851: Hawthorne and Moby-Dick", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1850%E2%80%931851%3A_Hawthorne_and_Moby-Dick", "scanLabel": "Wikipedia ↗", "flow": [{"line": "The earliest surviving mention of Moby-Dick is from a May 1, 1850, letter in which Melville told fellow sea author Richard Henry Dana Jr. \"I am half way in the work.\" In June, he described the book to his English publisher as \"a romance of adventure, founded upon certain wild legends in the Southern Sperm Whale Fisheries,\" and promised it would be done by the fall. The original manuscript has not survived. That summer, Melville read Thomas Carlyle, borrowing copies of Sartor Resartus (1833–34) and On Heroes, Hero-Worship, & the Heroic in History (1841) from the library of his friend Evert Duyckinck. These readings proved significant, occurring as Melville radically transformed his initial plan for the novel over the next several months, conceiving what Delbanco described in 2005 as \"the most ambitious book ever conceived by an American writer\".", "kinds": ["paragraph"]}, {"line": "From August 4 to 12, 1850, the Melvilles, Sarah Morewood, Duyckinck, Oliver Wendell Holmes, and other literary figures from New York City and Boston came to Pittsfield, Massachusetts, to enjoy a period of parties, picnics, and dinners. Nathaniel Hawthorne and his publisher James T. Fields joined the group while Hawthorne's wife stayed at home to look after the children. On one picnic outing organized by Duyckinck, Hawthorne and Melville sought shelter from the rain together and had a deep, private conversation. Melville had been given a copy of Hawthorne's short story collection Mosses from an Old Manse, though he had not yet read it. Melville then avidly read it and wrote a review, \"Hawthorne and His Mosses\", which appeared in two installments, on August 17 and 24, in The Literary World. Melville wrote that these stories revealed a dark side to Hawthorne, \"shrouded in blackness, ten times black\". He repeatedly compared Hawthorne to Shakespeare, and urged that \"men not very much inferior to Shakespeare are this day being born on the banks of the Ohio.\" The critic Walter Bezanson finds the essay \"so deeply related to Melville's imaginative and intellectual world while writing Moby-Dick\" that it could be regarded as a virtual preface and should be \"everybody's prime piece of contextual reading\". Later that summer, Duyckinck sent Hawthorne copies of Melville's three most recent books. Hawthorne read them, as he wrote to Duyckinck on August 29 that Melville in Redburn and White-Jacket put the reality \"more unflinchingly\" before his reader than any writer, and he thought Mardi was \"a rich book, with depths here and there that compel a man to swim for his life\". But he cautioned, \"It is so good that one scarcely pardons the writer for not having brooded long over it, so as to make it a great deal better\".", "kinds": ["paragraph"]}, {"line": "In September 1850, Melville borrowed three thousand dollars from his father-in-law Lemuel Shaw to buy a 160-acre farm in Pittsfield. Melville called his new home Arrowhead because of the arrowheads that were dug up around the property during planting season. That winter, Melville paid Hawthorne an unexpected visit, only to discover he was working and \"not in the mood for company\". Hawthorne's wife Sophia gave him copies of Twice-Told Tales and, for Malcolm, The Grandfather's Chair. Melville invited them to visit Arrowhead soon, hoping to \"[discuss] the Universe with a bottle of brandy & cigars\" with Hawthorne, but Hawthorne would not stop working on his new book for more than one day and they did not come. After a second visit from Melville, Hawthorne surprised him by arriving at Arrowhead with his daughter Una. According to Robertson-Lorant, \"The handsome Hawthorne made quite an impression on the Melville women, especially Augusta, who was a great fan of his books\". They spent the day mostly \"smoking and talking metaphysics\".", "kinds": ["paragraph"]}, {"line": "Robertson-Lorant writes that Melville was \"infatuated with Hawthorne's intellect, captivated by his artistry, and charmed by his elusive personality,\" but \"the friendship meant something different to each of them,\" with Hawthorne offering Melville \"the kind of intellectual stimulation he needed\". They may have been \"natural allies and friends,\" yet they were also \"fifteen years apart in age and temperamentally quite different\" and Hawthorne \"found Melville's manic intensity exhausting at times\". Bezanson identifies \"sexual excitement\" in all the ten letters Melville wrote to the older man. In the essay on Hawthorne's Mosses, Melville wrote: \"I feel that this Hawthorne has dropped germinous seeds into my soul. He expands and deepens down, the more I contemplate him; and further, and further, shoots his strong New-England roots into the hot soil of my Southern soul.\" Melville dedicated his book to Hawthorne: \"In token of my admiration for his genius, this book is inscribed to Nathaniel Hawthorne\".", "kinds": ["paragraph"]}, {"line": "On October 18, 1851, The Whale was published in Britain in three volumes, and on November 14 Moby-Dick appeared in the United States as a single volume. In between these dates, on October 22, 1851, the Melvilles' second child, Stanwix, was born. In December, Hawthorne told Duyckinck, \"What a book Melville has written! It gives me an idea of much greater power than his preceding ones.\" Unlike other contemporaneous reviewers of Melville, Hawthorne had seen the uniqueness of Melville's new novel and acknowledged it. In early December 1852, Melville visited the Hawthornes in Concord and discussed the idea of the \"Agatha\" story he had talked of with Hawthorne. This was the last contact between the two writers before Melville visited Hawthorne in Liverpool four years later when Hawthorne had relocated to England.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1852–1857: Unsuccessful writer", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1852%E2%80%931857%3A_Unsuccessful_writer", "scanLabel": "Wikipedia ↗", "flow": [{"line": "After having borrowed three thousand dollars from his father-in-law in September 1850 to buy a 160-acre farm in Pittsfield, Massachusetts, Melville had high hopes that his next book would please the public and restore his finances. In April 1851 he told his British publisher, Richard Bentley, that his new book had \"unquestionable novelty\" and was calculated to have wide appeal with elements of romance and mystery. In fact, Pierre: or, The Ambiguities was heavily psychological, though drawing on the conventions of the romance, and difficult in style. It was not well received. The New York Day Book published a venomous attack on September 8, 1852, headlined \"HERMAN MELVILLE CRAZY\". The item, offered as a news story, reported, A critical friend, who read Melville's last book, Ambiguities, between two steamboat accidents, told us that it appeared to be composed of the ravings and reveries of a madman. We were somewhat startled at the remark, but still more at learning, a few days after, that Melville was really supposed to be deranged, and that his friends were taking measures to place him under treatment. We hope one of the earliest precautions will be to keep him stringently secluded from pen and ink.", "kinds": ["paragraph"]}, {"line": "On May 22, 1853, Melville's third child and first daughter Elizabeth (Bessie) was born, and on or about that day Herman finished work on the Agatha story, Isle of the Cross. Melville traveled to New York to discuss a book, presumably Isle of the Cross, with his publisher, but later wrote that Harper & Brothers was \"prevented\" from publishing his manuscript because it was lost.", "kinds": ["paragraph"]}, {"line": "After the commercial and critical failure of Pierre, Melville had difficulty finding a publisher for his follow-up novel Israel Potter. Instead, this narrative of a Revolutionary War veteran was serialized in Putnam's Monthly Magazine in 1853. From November 1853 to 1856, Melville published fourteen tales and sketches in Putnam's and Harper's magazines. In December 1855 he proposed to Dix & Edwards, the new owners of Putnam's, that they publish a selective collection of the short fiction. The collection, titled The Piazza Tales, was named after a new introductory story Melville wrote for it, \"The Piazza\". It also contained five previously published stories, including \"Bartleby, the Scrivener\" and \"Benito Cereno\". On March 2, 1855, the Melvilles' fourth child, Frances (Fanny), was born. In this period, his book Israel Potter was published.", "kinds": ["paragraph"]}, {"line": "The writing of The Confidence-Man put great strain on Melville, leading Sam Shaw, a nephew of Lizzie, to write to his uncle Lemuel Shaw: \"Herman I hope has had no more of those ugly attacks\"—a reference to what Robertson-Lorant calls \"the bouts of rheumatism and sciatica that plagued Melville\". Melville's father-in-law apparently shared his daughter's \"great anxiety about him\" when he wrote a letter to a cousin, in which he described Melville's working habits: \"When he is deeply engaged in one of his literary works, he confines him[self] to hard study many hours in the day, with little or no exercise, and this specially in winter for a great many days together. He probably thus overworks himself and brings on severe nervous affections\". Shaw advanced Melville $1,500 from Lizzie's inheritance to travel four or five months in Europe and the Holy Land.", "kinds": ["paragraph"]}, {"line": "From October 11, 1856, to May 20, 1857, Melville made a six-month Grand Tour of Europe and the Mediterranean. While in England, in November 1856, he briefly reunited for three days with Hawthorne, who had taken the position of United States Consul at Liverpool, at that time the hub of Britain's Atlantic trade. At the nearby coast resort of Southport, amid the sand dunes where they had stopped to smoke cigars, they had a conversation that Hawthorne later described in his journal: Melville, as he always does, began to reason of Providence and futurity, and of everything that lies beyond human ken, and informed me that he 'pretty much made up his mind to be annihilated' [...] If he were a religious man, he would be one of the most truly religious and reverential; he has a very high and noble nature, and better worth immortality than most of us.", "kinds": ["paragraph"]}, {"line": "The Mediterranean part of the tour took in the Holy Land, which inspired his epic poem Clarel. During the tour he visited Mount Hope, a Christian farm near Jaffa. On April 1, 1857, Melville published his last full-length novel, The Confidence-Man. This novel, subtitled His Masquerade, has won general acclaim in modern times as a complex and mysterious exploration of issues of fraud and honesty, identity and masquerade. However, when it was published, it received reviews ranging from the bewildered to the denunciatory.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1857–1876: Poet", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1857%E2%80%931876%3A_Poet", "scanLabel": "Wikipedia ↗", "flow": [{"line": "To repair his faltering finances, Melville took up public lecturing from late 1857 to 1860. He embarked upon three lecture tours and spoke at lyceums, chiefly on Roman statuary and sightseeing in Rome. Melville's lectures, which mocked the pseudo-intellectualism of lyceum culture, were panned by contemporary audiences. On May 30, 1860, Melville boarded the clipper Meteor for California, with his brother Thomas at the helm. After a shaky trip around Cape Horn, Melville returned to New York alone via Panama in November. Later that year, he submitted a poetry collection to a publisher but it was not accepted, and is now lost. In 1863, he bought his brother's house at 104 East 26th Street in New York City and moved there.", "kinds": ["paragraph"]}, {"line": "In 1864, Melville visited the Virginia battlefields of the American Civil War. After the war, he published Battle-Pieces and Aspects of the War (1866), a collection of 72 poems that has been described as \"a polyphonic verse journal of the conflict\". The work did not do well commercially—of the print run of 1,260 copies, 300 were sent as review copies, and 551 copies were sold—and reviewers did not realize that Melville had purposely avoided the ostentatious diction and fine writing that were in fashion, choosing to be concise and spare.", "kinds": ["paragraph"]}, {"line": "In 1866, Melville became a customs inspector for New York City. He held the post for 19 years and had a reputation for honesty in a notoriously corrupt institution. (Unbeknownst to Melville, his position was sometimes protected by future American president Chester A. Arthur, then a customs official who admired Melville's writing but never spoke to him.) During these years, Melville suffered from nervous exhaustion, physical pain, and frustration, and would sometimes, in the words of Robertson-Lorant, behave like the \"tyrannical captains he had portrayed in his novels\", perhaps even beating his wife Lizzie when he came home after drinking. In 1867 Malcolm, the Melvilles' older son, died in his bedroom at home at the age of 18 from a self-inflicted gun shot, perhaps intentional, perhaps accidental. In May 1867, Lizzie's brother Sam, who shared his family's fear for Melville's sanity, tried to arrange for her to leave Melville. Lizzie was to visit her family in Boston and assert to a court that her husband was insane. But Lizzie, whether to avoid the social shame divorce carried at the time or because she still loved her husband, refused to go along with the plan.", "kinds": ["paragraph"]}, {"line": "Though Melville's professional writing career had ended, he remained dedicated to his writing. He spent years on what Milder called \"his autumnal masterpiece\" Clarel: A Poem and a Pilgrimage (1876), an 18,000-line epic poem inspired by his 1856 trip to the Holy Land. It is among the longest single poems in American literature. The title character is a young American student of divinity who travels to Jerusalem to renew his faith. One of the central characters, Rolfe, is similar to Melville in his younger days, a seeker and adventurer, while the reclusive Vine is loosely based on Hawthorne, who had died twelve years before. Publication of 350 copies was funded with a bequest from his uncle in 1876, but sales failed miserably and the unsold copies were burned when Melville was unable to buy them at cost. Critic Lewis Mumford found an unread copy in the New York Public Library in 1925 \"with its pages uncut\".", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "1877–1891: Final years", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#1877%E2%80%931891%3A_Final_years", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville's own income remained limited. But in 1884, Lizzie received a legacy that enabled him to buy a steady stream of books and prints each month. Melville retired on December 31, 1885, after several of his wife's relatives further supported the couple with supplementary legacies and inheritances. On February 22, 1886, Stanwix, their younger son, died in San Francisco at age 36, from tuberculosis. In 1889, Melville became a member of the New York Society Library.", "kinds": ["paragraph"]}, {"line": "Melville had a modest revival of popularity in England when readers rediscovered his novels. He published two collections of poems inspired by his early experiences at sea, with prose head notes. Intended for his relatives and friends, each had a print run of 25 copies. The first, John Marr and Other Sailors, was published in 1888, followed by Timoleon in 1891.", "kinds": ["paragraph"]}, {"line": "Melville died on the morning of September 28, 1891. His death certificate shows \"cardiac dilation\" as the cause. He was interred at Woodlawn Cemetery in the Bronx, New York City.", "kinds": ["paragraph"]}, {"line": "The New York Times' initial death notice called his masterpiece \"Mobie Dick\", the misspelling of which was later erroneously taken to mean that he was unappreciated at his time of death.  But there were some appreciations. The Times, for instance, published a substantial article of appreciation on October 2. The author said that thinking back to Melville's books that were so much read forty years earlier, there is \"no difficulty determining why they were then read and talked about,\" but the difficulty is \"to discover why they are read and talked about no longer.\"", "kinds": ["paragraph"]}, {"line": "Melville left a volume of poetry, Weeds and Wildings, and a sketch, \"Daniel Orme\", unpublished at the time of his death. His wife also found pages for an unfinished novella, titled Billy Budd. Melville had revised and rearranged the manuscript in several stages, leaving the pages in disarray. Lizzie could not decide her husband's intentions (or even read his handwriting in some places) and abandoned attempts to edit the manuscript for publication. The pages were stored in a family breadbox until 1919 when Melville's granddaughter gave them to Raymond Weaver. Weaver, who initially dismissed the work's importance, published a quick transcription in 1924. This version, however, contained many misreadings, some of which affected interpretation. It was an immediate critical success in England, then in the United States. It was adapted as a stage play on Broadway in 1951, then an opera, and in 1961 as a film. In 1962, the Melville scholars Harrison Hayford and Merton M. Sealts published a critical reading text that was widely accepted.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "General narrative style", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#General_narrative_style", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville's writing style shows both consistencies and enormous changes throughout the years. His development \"had been abnormally postponed, and when it came, it came with a rush and a force that had the menace of quick exhaustion in it\". As early as \"Fragments from a Writing Desk\", written when Melville was 20, scholar Sealts sees \"a number of elements that anticipate Melville's later writing, especially his characteristic habit of abundant literary allusion\". Typee and Omoo were documentary adventures that called for a division of the narrative in short chapters. Such compact organization bears the risk of fragmentation when applied to a lengthy work such as Mardi, but with Redburn and White Jacket, Melville turned the short chapter into a concentrated narrative.", "kinds": ["paragraph"]}, {"line": "Some chapters of Moby-Dick are no more than two pages in standard editions, and an extreme example is Chapter 122, consisting of a single paragraph of 36 words. The skillful handling of chapters in Moby-Dick is one of the most fully developed Melvillean signatures, and is a measure of his masterly writing style (something that would lend lasting significance to the opening lines \"Call me Ishmael\"). Individual chapters have become \"a touchstone for appreciation of Melville's art and for explanation\" of his themes. In contrast, the chapters in Pierre, called Books, are divided into short-numbered sections, seemingly an \"odd formal compromise\" between Melville's natural length and his purpose to write a regular romance that called for longer chapters. As satirical elements were introduced, the chapter arrangement restores \"some degree of organization and pace from the chaos\". The usual chapter unit then reappears for Israel Potter, The Confidence-Man and even Clarel, but only becomes \"a vital part in the whole creative achievement\" again in the juxtaposition of accents and of topics in Billy Budd.", "kinds": ["paragraph"]}, {"line": "Newton Arvin points out that only superficially the books after Mardi seem as if Melville's writing went back to the vein of his first two books. In reality, his movement \"was not a retrograde but a spiral one\", and while Redburn and White Jacket may lack the spontaneous, youthful charm of his first two books, they are \"denser in substance, richer in feeling, tauter, more complex, more connotative in texture and imagery\". The rhythm of the prose in Omoo \"achieves little more than easiness; the language is almost neutral and without idiosyncrasy\", while Redburn shows an improved ability in narrative, which fuses imagery and emotion.", "kinds": ["paragraph"]}, {"line": "Melville's early works were \"increasingly baroque\" in style, and with Moby-Dick Melville's vocabulary had grown superabundant. Walter Bezanson calls it an \"immensely varied style\". According to critic Warner Berthoff, three characteristic uses of language can be recognized. First, the exaggerated repetition of words, as in the series \"pitiable\", \"pity\", \"pitied\", and \"piteous\". A second typical device is the use of unusual adjective-noun combinations, as in \"concentrating brow\" and \"immaculate manliness\". A third characteristic is the presence of a participial modifier to emphasize and to reinforce the already established expectations of the reader, as the words \"preluding\" and \"foreshadowing\" (\"so still and subdued and yet somehow preluding was all the scene ...\" \"In this foreshadowing interval ...\").", "kinds": ["paragraph"]}, {"line": "After his use of hyphenated compounds in Pierre, Melville's writing gives Berthoff the impression of becoming less exploratory and less provocative in his choices of words and phrases. Instead of providing a lead \"into possible meanings and openings-out of the material in hand,\" the vocabulary now served \"to crystallize governing impressions,\" the diction no longer attracted attention to itself, except as an effort at exact definition. The language, Berthoff continues, reflects a \"controlling intelligence, of right judgment and completed understanding\". The sense of free inquiry and exploration that infused his earlier writing and accounted for its \"rare force and expansiveness,\" tended to give way to \"static enumeration\". By comparison to the verbal music and kinetic energy of Moby-Dick, Melville's subsequent writings seem \"relatively muted, even withheld\" in his later works.", "kinds": ["paragraph"]}, {"line": "Melville's paragraphing in his best work Berthoff considers to be the virtuous result of \"compactness of form and free assembling of unanticipated further data\", such as when the mysterious sperm whale is compared with Exodus's invisibility of God's face in the final paragraph of Chapter 86 (\"The Tail\"). Over time Melville's paragraphs became shorter as his sentences grew longer, until he arrived at the \"one-sentence paragraphing characteristic of his later prose\". Berthoff points to the opening chapter of The Confidence-Man for an example, as it counts fifteen paragraphs, seven of which consist of only one elaborate sentence, and four that have only two sentences. The use of a similar technique in Billy Budd contributes in large part, Berthoff says, to its \"remarkable narrative economy\".", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Style and literary allusion", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Style_and_literary_allusion", "scanLabel": "Wikipedia ↗", "flow": [{"line": "In Nathalia Wright's view, Melville's sentences generally have a looseness of structure, easy to use for devices as catalogue and allusion, parallel and refrain, proverb and allegory. The length of his clauses may vary greatly, but the narrative style of writing in Pierre and The Confidence-Man is there to convey feeling, not thought. Unlike Henry James, who was an innovator of sentence ordering to render the subtlest nuances in thought, Melville made few such innovations. His domain is the mainstream of English prose, with its rhythm and simplicity influenced by the King James Bible. Another important characteristic of Melville's writing style is in its echoes and overtones. Melville's imitation of certain distinct styles is responsible for this. His three most important sources, in order, are the Bible, Shakespeare, and Milton. Direct quotation from any of the sources is slight; only one sixth of his Biblical allusions can be qualified as such because Melville adapts Biblical usage to his own narrated textual requirements.", "kinds": ["paragraph"]}, {"line": "The Biblical elements in Melville's style can be divided into three categories. In the first, allusion is more within the narrative rather than formal quotation. Several preferred Biblical allusions appear repeatedly throughout his body of work, taking on the nature of refrains. Examples are the injunctions to be 'as wise as serpents and as harmless as doves,' 'death on a pale horse,' 'the man of sorrows', the 'many mansions of heaven;' proverbs 'as the hairs on our heads are numbered,' 'pride goes before a fall,' 'the wages of sin is death;' adverbs and pronouns as 'verily, whoso, forasmuch as; phrases as come to pass, children's children, the fat of the land, vanity of vanities, outer darkness, the apple of his eye, Ancient of Days, the rose of Sharon.' Second, there are paraphrases of individual and combined verses. Redburn's \"Thou shalt not lay stripes upon these Roman citizens\" makes use of language of the Ten Commandments in Ex.20 and Pierre's inquiry of Lucy: \"Loveth she me with the love past all understanding?\" combines John 21:15–17, and Philippians 4:7. Third, certain Hebraisms are used, such as a succession of genitives (\"all the waves of the billows of the seas of the boisterous mob\"), the cognate accusative (\"I dreamed a dream\", \"Liverpool was created with the Creation\"), and the parallel (\"Closer home does it go than a rammer; and fighting with steel is a play without ever an interlude\"). This passage from Redburn shows how these ways of alluding interlock and result in a texture of Biblical language though there is very little direct quotation:", "kinds": ["paragraph"]}, {"line": "The other world beyond this, which was longed for by the devout before Columbus' time, was found in the New; and the deep-sea land, that first struck these soundings, brought up the soil of Earth's Paradise. Not a Paradise then, or now; but to be made so at God's good pleasure, and in the fulness and mellowness of time. The seed is sown, and the harvest must come; and our children's children, on the world's jubilee morning, shall all go with their sickles to the reaping. Then shall the curse of Babel be revoked, a new Pentecost come, and the language they shall speak shall be the language of Britain. Frenchmen, and Danes, and Scots; and the dwellers on the shores of the Mediterranean, and in the regions round about; Italians, and Indians, and Moors; there shall appear unto them cloven tongues as of fire.", "kinds": ["paragraph"]}, {"line": "In addition to this, Melville successfully imitates three Biblical strains: the apocalyptic, the prophetic and the sermonic narrative tone of writing. Melville sustains the apocalyptic tone of anxiety and foreboding for a whole chapter of Mardi. The prophetic strain is expressed by Melville in Moby-Dick, most notably in Father Mapple's sermon. The tradition of the Psalms is imitated at length by Melville in The Confidence-Man.", "kinds": ["paragraph"]}, {"line": "In 1849, Melville acquired an edition of Shakespeare's works printed in a font large enough for his tired eyes, which led to a deeper study of Shakespeare that greatly influenced the style of his next book, Moby-Dick (1851). The critic F. O. Matthiessen found that the language of Shakespeare far surpasses other influences upon the book, in that it inspired Melville to discover his own full strength. On almost every page, debts to Shakespeare can be discovered. The \"mere sounds, full of Leviathanism, but signifying nothing\" at the end of \"Cetology\" (Ch. 32) echo the famous phrase in Macbeth: \"Told by an idiot, full of sound and fury/ Signifying nothing\". Ahab's first extended speech to the crew, in the \"Quarter-Deck\" (Ch. 36) is practically blank verse and so is Ahab's soliloquy at the beginning of \"Sunset\" (Ch. 37): 'I leave a white and turbid wake;/ Pale waters, paler cheeks, where'er I sail./ The envious billows sidelong swell to whelm/ My track; let them; but first I pass.' Through Shakespeare, Melville infused Moby-Dick with a power of expression he had not previously expressed. Reading Shakespeare had been \"a catalytic agent\" for Melville, one that transformed his writing from merely reporting to \"the expression of profound natural forces\". The extent to which Melville assimilated Shakespeare is evident in the description of Ahab, Matthiessen continues, which ends in language that seems Shakespearean yet is no imitation: 'Oh, Ahab! what shall be grand in thee, it must needs be plucked from the skies and dived for in the deep, and featured in the unbodied air!' The imaginative richness of the final phrase seems particularly Shakespearean, \"but its two key words appear only once each in the plays ... and to neither of these usages is Melville indebted for his fresh combination\". Melville's diction depended upon no source, and his prose is not based on anybody else's verse but on an awareness of \"speech rhythm\".", "kinds": ["paragraph"]}, {"line": "Melville's mastering of Shakespeare, Matthiessen finds, supplied him with verbal resources that enabled him to create dramatic language through three essential techniques. First, the use of verbs of action creates a sense of movement and meaning. The effective tension caused by the contrast of \"thou launchest navies of full-freighted worlds\" and \"there's that in here that still remains indifferent\" in \"The Candles\" (Ch. 119) makes the last clause lead to a \"compulsion to strike the breast,\" which suggests \"how thoroughly the drama has come to inhere in the words;\" Second, Melville took advantage of the Shakespearean energy of verbal compounds, as in \"full-freighted\". Third, Melville employed the device of making one part of speech act as another, for example, 'earthquake' as an adjective, or turning an adjective into a noun, as in \"placeless\".", "kinds": ["paragraph"]}, {"line": "Melville's style, in Nathalia Wright's analysis, seamlessly flows over into theme, because all these borrowings have an artistic purpose, which is to suggest an appearance \"larger and more significant than life\" for characters and themes that are in fact unremarkable. The allusions suggest that beyond the world of appearances another world exists, one that influences this world, and where ultimate truth can be found. Moreover, the ancient background thus suggested for Melville's narratives – ancient allusions being next in number to the Biblical ones – invests them with a sense of timelessness.", "kinds": ["paragraph"]}, {"line": "In addition to the classical references and stylistic elements, Melville openly referred to a multitude of contemporary scientific and maritime works. He read and referenced works by whalers, sailors, and naturalists in his novel Moby-Dick. A large number of volumes he actually owned and annotated have been scanned and made available for online viewing, complete with his notes in the margins.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Critical reception", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Critical_reception", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville's financial success as a writer during his lifetime was not great, relative to his posthumous success; over his entire lifetime Melville's writings earned him just over $10,000 (equivalent to $302,344 in 2025). Melville's travelogues based on voyages to the South Seas and stories based on his time in the merchant marine and navy led to some initial success, but his popularity declined dramatically afterwards. By 1876, all of his books were out of print. He was viewed as a minor figure in American literature in the later years of his life and during the years immediately after his death.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Poetry", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Poetry", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville did not publish poetry until his late forties, with Battle-Pieces (1866), and did not receive recognition as a poet until well into the 20th century. But he wrote predominantly poetry for about 25 years, twice as long as his prose career. The three novels of the 1850s that Melville worked on most seriously to present his philosophical explorations, Moby-Dick, Pierre, and The Confidence Man, seem to make the step to philosophical poetry a natural one rather than simply a consequence of commercial failure. Since he turned to poetry as a meditative practice, his poetic style, even more than most Victorian poets, was not marked by linguistic play or melodic considerations.", "kinds": ["paragraph"]}, {"line": "Early critics were not sympathetic. Henry Chapin, in his introduction to John Marr and Other Poems (1922), one of the earlier selections of Melville's poetry, said Melville's verse is \"of an amateurish and uneven quality\" but in it \"that loveable freshness of personality, which his philosophical dejection never quenched, is everywhere in evidence,\" in \"the voice of a true poet\". The poet and novelist Robert Penn Warren became a champion of Melville as a great American poet and issued a selection of Melville's poetry in 1971 prefaced by an admiring critical essay. In the 1990s critic Lawrence Buell argued that Melville \"is justly said to be nineteenth-century America's leading poet after Whitman and Dickinson\" and Helen Vendler remarked of Clarel: \"What it cost Melville to write this poem makes us pause, reading it. Alone, it is enough to win him, as a poet, what he called 'the belated funeral flower of fame'.\" Some critics now place him as the first modernist poet in the United States while others assert that his work more strongly suggests what today would be a postmodern view.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Melville revival and Melville studies", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Melville_revival_and_Melville_studies", "scanLabel": "Wikipedia ↗", "flow": [{"line": "The 1919 centennial of Melville's birth coincided with a renewed interest in his writings known as the \"Melville revival\", during which his work experienced a significant critical reassessment. The renewed appreciation began in 1917 with Carl Van Doren's article on Melville in a standard history of American literature. Van Doren also encouraged Raymond Weaver, who wrote the author's first full-length biography, Herman Melville: Mariner and Mystic (1921). Discovering the unfinished manuscript of Billy Budd, among papers shown to him by Melville's granddaughter, Weaver edited it and published it in a new collected edition of Melville's works. Other works that helped fan the flames for Melville were Carl Van Doren's The American Novel (1921), D. H. Lawrence's Studies in Classic American Literature (1923), Carl Van Vechten's essay in The Double Dealer (1922), and Lewis Mumford's biography Herman Melville (1929).", "kinds": ["paragraph"]}, {"line": "Starting in the mid-1930s, the Yale University scholar Stanley Thomas Williams supervised more than a dozen dissertations on Melville that were eventually published as books. Where the first wave of Melville scholars focused on psychology, Williams' students were prominent in establishing Melville Studies as an academic field concerned with texts and manuscripts, tracing Melville's influences and borrowings (even plagiarism), and exploring archives and local publications. To provide historical evidence, the independent scholar Jay Leyda searched libraries, family papers, local archives and newspapers across New England and New York to document Melville's life day by day for his two-volume The Melville Log (1951). Sparked by Leyda and post-war scholars, the second phase of the Melville Revival emphasized research into the biography of Melville rather than accepting Melville's early books as reliable accounts.", "kinds": ["paragraph"]}, {"line": "In 1945, The Melville Society was founded, a non-profit organization dedicated to the study of Melville's life and works. Between 1969 and 2003, the society published 125 issues of Melville Society Extracts, which are now freely available on the society's website. Since 1999 it has published Leviathan: A Journal of Melville Studies, currently three issues a year, published by Johns Hopkins University Press.", "kinds": ["paragraph"]}, {"line": "The postwar scholars tended to think that Weaver, Harvard psychologist Henry Murray, and Mumford favored Freudian interpretations that read Melville's fiction as autobiography, exaggerated his suffering in the family, and inferred a homosexual attachment to Hawthorne. They saw a different arc to Melville's writing career. The first biographers saw a tragic withdrawal after the cold critical reception of his prose works and largely dismissed his poetry. A new view emerged of Melville's turn to poetry as a conscious choice that placed him among the most important American poets. Other post-war studies, however, continued the broad imaginative and interpretive style; Charles Olson's Call Me Ishmael (1947) presented Ahab as a Shakespearean tragic hero, and Newton Arvin's critical biography, Herman Melville (1950), won the National Book Award for non-fiction in 1951.", "kinds": ["paragraph"]}, {"line": "In the 1960s, Harrison Hayford organized an alliance between Northwestern University Press and the Newberry Library, with backing from the Modern Language Association and funding from the National Endowment for the Humanities, to edit and publish reliable critical texts of Melville's complete works, including unpublished poems, journals, and correspondence. The first volume of the Northwestern-Newberry Edition of The Writings of Herman Melville was published in 1968 and the last in the fall of 2017. The aim of the editors was to present a text \"as close as possible to the author's intention as surviving evidence permits\". The volumes have extensive appendices, including textual variants from each of the editions published in Melville's lifetime, an historical note on the publishing history and critical reception, and related documents. Because the texts were prepared with financial support from the United States Department of Education, no royalties are charged, and they have been widely reprinted. Hershel Parker published his two-volume Herman Melville: A Biography, in 1996 and 2002, based on extensive original research and his involvement as editor of the Northwestern-Newberry Melville edition.", "kinds": ["paragraph"]}, {"line": "Today Melville's works feature in programs such as the coll
