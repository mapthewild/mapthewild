aboration between Williams College and the Mystic Seaport maritime museum, which together have created an interdisciplinary ocean and coastal studies program. Williams-Mystic integrates marine science, maritime history, environmental policy, and literature of the sea. Melville scholars Mary Bercaw Edwards and Richard J. King feature among the program's professors.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Gender studies", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Gender_studies", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville only gradually attracted the pioneering scholars of women's studies, gender, and sexuality in the 1970s and 1980s. Though some held that he hardly portrayed women at all, others saw the few women in his works as traditional figures representing, or even attacking, nineteenth-century gentility, sentimentality, and conventional morality. Melville's preference for sea-going tales that involved almost only males has been of interest to scholars in men's studies and especially gay and queer studies. Melville was remarkably open in his exploration of sexuality of all sorts. Alvin Sandberg said that the short story \"The Paradise of Bachelors and the Tartarus of Maids\" offers \"an exploration of impotency, a portrayal of a man retreating to an all-male childhood to avoid confrontation with sexual manhood,\" from which the narrator engages in \"congenial\" digressions in heterogeneity. In line with this view, Warren Rosenberg argues the homosocial \"Paradise of Bachelors\" is \"blind to what is real and painful in the world, and thus are [sic] superficial and sterile\".", "kinds": ["paragraph"]}, {"line": "David Harley Serlin observes in the second half of Melville's diptych, \"The Tartarus of Maids\", the narrator gives voice to the oppressed women he observes:", "kinds": ["paragraph"]}, {"line": "As other scholars have noted, the \"slave\" image here has two clear connotations. One describes the exploitation of the women's physical labor, and the other describes the exploitation of the women's reproductive organs. Of course, as models of women's oppression, the two are clearly intertwined.", "kinds": ["paragraph"]}, {"line": "In the end Serlin says that the narrator is never fully able to come to terms with the contrasting masculine and feminine modalities.", "kinds": ["paragraph"]}, {"line": "Issues of sexuality have been observed in other works as well. Rosenberg notes Taji, in Mardi, and the protagonist in Pierre \"think they are saving young 'maidens in distress' (Yillah and Isabel) out of the purest of reasons but both are also conscious of a lurking sexual motive\". When Taji kills the old priest holding Yillah captive, he says,", "kinds": ["paragraph"]}, {"line": "[R]emorse smote me hard; and like lightning I asked myself whether the death deed I had done was sprung of virtuous motive, the rescuing of a captive from thrall, or whether beneath the pretense I had engaged in this fatal affray for some other selfish purpose, the companionship of a beautiful maid.", "kinds": ["paragraph"]}, {"line": "In Pierre, the motive of the protagonist's sacrifice for Isabel is admitted: \"womanly beauty and not womanly ugliness invited him to champion the right\". Rosenberg argues,", "kinds": ["paragraph"]}, {"line": "This awareness of a double motive haunts both books and ultimately destroys their protagonists who would not fully acknowledge the dark underside of their idealism. The epistemological quest and the transcendental quest for love and belief are consequently sullied by the erotic.", "kinds": ["paragraph"]}, {"line": "Rosenberg says that Melville fully explores the theme of sexuality in his major epic poem, Clarel. When the narrator is separated from Ruth, with whom he has fallen in love, he is free to explore other sexual (and religious) possibilities before deciding at the end of the poem to participate in the ritualistic order represented by marriage. In the course of the poem, \"he considers every form of sexual orientation – celibacy, homosexuality, hedonism, and heterosexuality – raising the same kinds of questions as when he considers Islam or Democracy\".", "kinds": ["paragraph"]}, {"line": "Some passages and sections of Melville's works demonstrate his willingness to address all forms of sexuality, including the homoerotic, in his works. Commonly noted examples from Moby-Dick are the \"marriage bed\" episode involving Ishmael and Queequeg, who sleep with their arms wrapped around each other (Chapter 4, \"The Counterpane\" and Chapter 10, \"A Bosom Friend\"); and the \"Squeeze of the Hand\" (Chapter 94) describing the camaraderie of sailors' extracting spermaceti from a dead whale. Clarel recognizes the homoerotic potential of its eponymous protagonist, including, in a fairly explicit passage, an erection provoked by the figure of a male interlocutor, Lyonesse. In addition, Rosenberg notes that Billy Budd's physical attractiveness is described in quasi-feminine terms: \"As the Handsome Sailor, Billy Budd's position aboard the seventy-four was something analogous to that of a rustic beauty transplanted from the provinces and brought into competition with the highborn dames of the court\".", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Law and literature", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Law_and_literature", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville has been cited in the field of law and literature. The chapter \"Fast-Fish and Loose-Fish\" in Moby-Dick, for instance, challenges concepts of property rights. In Billy Budd, a handsome and popular young sailor strikes and inadvertently kills the ship's master-at-arms. The ship's captain immediately convenes a court-martial at which he urges the court to convict and sentence Billy to death. Critics debate Melville's intention. Some see the contradiction between unbending legalism and malleable moral principles. Other critics have argued that the captain manipulated and misrepresented the applicable laws.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Themes", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Themes", "scanLabel": "Wikipedia ↗", "flow": [{"line": "Melville's work often touched on themes of communicative expression and the pursuit of the absolute among illusions. As early as 1839, in the juvenile sketch \"Fragments from a Writing Desk\", Melville explores a problem that would reappear in the short stories \"Bartleby\" (1853) and \"Benito Cereno\" (1855): the impossibility to find common ground for mutual communication. The sketch centers on the protagonist and a mute lady, leading scholar Sealts to observe: \"Melville's deep concern with expression and communication evidently began early in his career\".", "kinds": ["paragraph"]}, {"line": "According to scholar Nathalia Wright, Melville's characters are all preoccupied by the same intense, superhuman and eternal quest for \"the absolute amidst its relative manifestations,\" an enterprise central to the Melville canon: \"All Melville's plots describe this pursuit, and all his themes represent the delicate and shifting relationship between its truth and its illusion\". It is not clear, however, what the moral and metaphysical implications of this quest are, because Melville did not distinguish between these two aspects. Throughout his life Melville struggled with and gave shape to the same set of epistemological doubts and the metaphysical issues these doubts engendered. An obsession for the limits of knowledge led to the question of God's existence and nature, the indifference of the universe, and the problem of evil.", "kinds": ["paragraph"]}]}, {"origin": "wikipedia", "head": "Legacy and honors", "scan": "https://en.wikipedia.org/w/index.php?title=Herman_Melville&oldid=1378125674#Legacy_and_honors", "scanLabel": "Wikipedia ↗", "flow": [{"line": "In 1854, three years following publication of Moby-Dick, Melville, New York, on Long Island, was named in Melville's honor.", "kinds": ["paragraph"]}, {"line": "In 1982, the Library of America (LOA) began publishing works in honor of Melville's central place in American culture; the first volume contained Typee, Omoo, and Mardi. Subsequent volumes included Melville's Redburn, White-Jacket, and Moby-Dick, published in 1983, and Pierre, Israel Potter, The Confidence-Man, Tales, and Billy Budd, published in 1985. LOA did not publish his complete poetry until 2019.", "kinds": ["paragraph"]}, {"line": "On August 1, 1984, as part of the Literary Arts Series of stamps, the U.S. Postal Service issued a 20-cent commemorative stamp to honor Melville. The setting for the first day of issue was the Whaling Museum in New Bedford, Massachusetts.", "kinds": ["paragraph"]}, {"line": "In 1985, the New York City Herman Melville Society gathered at 104 East 26th Street to dedicate the intersection of Park Avenue South and 26th Street as Herman Melville Square, where Melville lived from 1863 to 1891 and where he authored Billy Budd and other works. Melville's house in Lansingburgh, New York, houses the Lansingburgh Historical Society.", "kinds": ["paragraph"]}, {"line": "In 2010, a species of extinct sperm whale, Livyatan melvillei, was named in honor of Melville. The paleontologists who discovered the fossil were fans of Moby-Dick, and dedicated their discovery to the author.", "kinds": ["paragraph"]}, {"line": "Melville himself did not live to see the ultimate success of his masterpiece. At the time of his death in 1891, the slow burn of interest in Moby-Dick had not yet caught fire. Melville died not knowing that his novel would become a lasting cultural phenomenon, and that the term \"white whale\" would still be understood, two centuries hence, even by people who had never read his work.", "kinds": ["paragraph"]}]}]}], "localEdition": true}</scrip
