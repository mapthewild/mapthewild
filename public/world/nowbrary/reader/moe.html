    <script id="shelf-data" type="application/json">{"_about": "Moe's nowbrary shelf, from ~/Documents/mapthewild/NOWBRARY-SHELF.md (13 Oct 2026). The 'why' text is Moe's, copied exactly as he wrote it, typos included. Do not edit it. Titles and authors were looked up by Claude.", "books": [{"id": "pedagogy-of-the-oppressed", "title": "Pedagogy of the Oppressed", "author": "Paulo Freire", "why": "i found it while walking the open office halls of a past employer and i found a tattered copy, stood their thumbing through it when i realized i'd gone 3 chapters in, it's probably what had me understand what facilitation was and the shapes it took and probably planted a seed on what good facilitation could be", "highlights": [], "look": {"kind": "modern", "cloth": "#e65c3a", "ink": "#302f2b"}}, {"id": "nasreddin-hoca", "title": "Nasreddin Hoca stories", "author": "", "why": "were the kind of childhood stories that had me wonder about the people who thought differently, and the way they subverted the known world by being playful", "highlights": [], "look": {"kind": "modern", "cloth": "#467a9b", "ink": "#fcf3db"}}, {"id": "fluke", "readwiseId": 40073955, "title": "Fluke", "author": "Brian Klaas", "look": {"cloth": "#b5a0d1", "ink": "#282d32", "kind": "modern"}, "openOnPassage": true, "attachedNotes": true, "titlePage": [["xs wide", "MOE’S READING NOTES"], ["gap", ""], ["xl", "Fluke"], ["m", "Brian Klaas"], ["rule", ""], ["s it", "Selected passages with marginalia"]], "link": {"href": "https://readwise.io/bookreview/40073955", "label": "Notes in Readwise ↗", "text": "Full highlights and notes in Readwise"}, "pages": [{"origin": "readwise", "head": "2 · Changing anything changes everything", "isExcerpt": false, "scan": "https://readwise.io/open/714034968", "scanLabel": "In Readwise ↗", "highlightId": 714034968, "sourceLocation": {"type": "offset", "value": 59800}, "highlightedAt": "2024-05-02T00:30:01.213855Z", "flow": [{"line": "The conventional wisdom of separated individuals acting purposively and independently has become so pervasive that saying something like “Actually, we’re all completely intertwined in a unified causal web of existence” makes one sound like a New Age guru with a self-help book, rather than someone proclaiming an observable, empirical fact. (Within science, it’s often the theoretical physicists who embrace and spread this message the most.)", "kinds": ["score"]}, {"note": "Time to read up on this. But also, possibly why I read stuff about the metaphysical when I was younger, maybe I should check into that again"}]}, {"origin": "readwise", "head": "3 · Everything doesn’t happen for a reason", "isExcerpt": false, "scan": "https://readwise.io/open/714494159", "scanLabel": "In Readwise ↗", "highlightId": 714494159, "sourceLocation": {"type": "offset", "value": 78206}, "highlightedAt": "2024-05-03T00:18:39.976419Z", "flow": [{"line": "Marmorkrebs are an invasive species, with a penchant for devouring rice fields. But in their cloned millions, they’ve provided unexpected benefits, too", "kinds": ["score"]}, {"note": "Not too sure about this but can't be bothered to look it up at the moment"}]}, {"origin": "readwise", "head": "4 · Why our brains distort reality", "isExcerpt": false, "scan": "https://readwise.io/open/714514304", "scanLabel": "In Readwise ↗", "highlightId": 714514304, "sourceLocation": {"type": "offset", "value": 138273}, "highlightedAt": "2024-05-03T00:37:48.891919Z", "flow": [{"line": "uperstition is the daughter of the unexplained and the apparently random. We invent it to deal with causal uncertainty, a disorienting feeling we experience when we don’t know why something is happening and we feel like the playthings of chaos. Superstition is not, as many unfairly believe, the providence of simpletons. Instead, it is an understandable and nearly universal way that humans assert control when they feel that ordinary, rational methods of manipulating the world have become fruitless. In the words of Theodore Zeldin, superstition functions the same as the “modern car-driver, who does not know how his car works, but trusts it all the same, interested only in knowing which button to press.” The lucky amulet may not work, but if bombs are raining from the skies, have you got any better ideas?", "kinds": ["score"]}, {"note": "social media is just spreading what is already happening, the feeling of mass loss of control, something no one had is laid bare, what will gen ai do to people?"}]}, {"origin": "readwise", "head": "4 · Why our brains distort reality", "isExcerpt": false, "scan": "https://readwise.io/open/714496039", "scanLabel": "In Readwise ↗", "highlightId": 714496039, "sourceLocation": {"type": "offset", "value": 140812}, "highlightedAt": "2024-05-03T00:40:39.183215Z", "flow": [{"line": "If we don’t know why, we pretend we do. Nowhere is this tendency to invent causes more apparent than with split-brain experiments. Every so often, someone with severe epilepsy undergoes a surgery that severs the corpus callosum, a thick tract of nerves that connects the right hemisphere of the brain with the left. Patients are still able to function, but information can’t physically pass between the two distinct hemispheres of the brain—the channel has been cut. The left half of the brain specializes in language, so it’s where we formulate narrative explanations for understanding the world. Bizarrely, experiments have shown that when information is given to the right half of the patient’s brain, but not to the left, the patient’s left hemisphere deals with the confusion by automatically inventing a plausible explanation. This gave rise to the neuroscience theory that the left hemisphere can be thought of as the Interpreter within our skulls. When there are no reasons, our brains make one up.", "kinds": ["score"]}, {"note": "i feel like these a short story between these walls"}]}]}, {"id": "how-data-happened", "readwiseId": 45154742, "title": "How Data Happened", "author": "Chris Wiggins & Matthew L. Jones", "look": {"cloth": "#c8d35b", "ink": "#293d37", "kind": "modern"}, "openOnPassage": true, "attachedNotes": true, "titlePage": [["xs wide", "MOE’S READING NOTES"], ["gap", ""], ["xl", "How Data Happened"], ["m", "Chris Wiggins & Matthew L. Jones"], ["rule", ""], ["s it", "Selected passages with marginalia"]], "link": {"href": "https://readwise.io/bookreview/45154742", "label": "Notes in Readwise ↗", "text": "Full highlights and notes in Readwise"}, "pages": [{"origin": "readwise", "head": "1 · The Stakes", "isExcerpt": true, "scan": "https://readwise.io/open/801677487", "scanLabel": "In Readwise ↗", "highlightId": 801677487, "sourceLocation": {"type": "offset", "value": 18027}, "highlightedAt": "2024-10-21T22:07:48.148112Z", "flow": [{"line": "Within a few years of the surge of critical concern, the likes of Google, Facebook and IBM all had in-house AI ethicists. These firms—economic powerhouses financially equivalent to many nation-states—had quickly appropriated the critical movement, hiring many of the most brilliant critics, but often silencing or disempowering them when the criticism got too hot. It was as though the Pope had hired Martin Luther and set him up in a corner office of the Vatican, while the indulgences spurring the Reformation went on relatively unabated. The researchers hired by the likes of Google, such as Timnit Gebru and Margaret Mitchell, too often found themselves challenged as they struggled not to be co-opted. The computer science research community, for its part, turned these deep concerns about fairness into new algorithmic puzzles, but too often carefully gated them away from reflections upon power.", "kinds": ["score"]}, {"note": "Image of frog boiling in a gilded cage\n\n"}]}, {"origin": "readwise", "head": "1 · The Stakes", "isExcerpt": false, "scan": "https://readwise.io/open/852240070", "scanLabel": "In Readwise ↗", "highlightId": 852240070, "sourceLocation": {"type": "offset", "value": 30773}, "highlightedAt": "2025-02-14T19:59:05.773048Z", "flow": [{"line": "History as Solvent\n\nPowerful forces often are reticent to investigate the historical genesis that made them possible—or even dominant. Complex histories unsettle the obviousness, the legitimacy, of their power.22 In looking at the far from obvious ways technologies come to prominence, history unsettles the idea that the growth of certain technologies themselves drives history, a view called “technological determinism.” It has been very lucrative for many interested actors, for example, to claim that older views of privacy are outdated in the age of the internet, even that the internet itself causes the decline of privacy. Neither claim is true. But such stories offer a potent version of history, ubiquitous in debates around the internet, that legitimates the current order of things as necessarily so.", "kinds": ["score"]}, {"note": "Makes me wonder how much of the present moment the foresaw and what comes next in their estimate"}]}, {"origin": "readwise", "head": "1 · The Stakes", "isExcerpt": false, "scan": "https://readwise.io/open/852241762", "scanLabel": "In Readwise ↗", "highlightId": 852241762, "sourceLocation": {"type": "offset", "value": 33764}, "highlightedAt": "2025-02-14T20:04:56.172312Z", "flow": [{"line": "The science historian Theodore Porter argues that standardized forms of numerical accounting, such as cost-benefit analysis, arose to contest the power of human “black boxes,” experts with authority grounded in traditional status and opaque forms of judgment. Numerical accountability, with its promises of transparency and rule-bound objectivity, typically gained prominence in conditions of distrust about experts.26 The 1933 “Truth in Securities” act, for example, sought to bolster trust in capital markets through uniform standards of accounting and reporting, which were bitterly resisted by Wall Street and its accountants. Forcing banks years later to reveal their protocols for lending money revealed systematically racist criteria and forced creation of new criteria.", "kinds": ["score"]}, {"note": "Where else are there human black boxes"}]}, {"origin": "readwise", "head": "2 · Social Physics and l’homme moyen", "isExcerpt": false, "scan": "https://readwise.io/open/852247454", "scanLabel": "In Readwise ↗", "highlightId": 852247454, "sourceLocation": {"type": "offset", "value": 43202}, "highlightedAt": "2025-02-14T20:23:50.029789Z", "flow": [{"line": "War required money; money required taxes; taxes required growing bureaucracies; and these bureaucracies needed data. The burgeoning states of Enlightenment Europe needed to know what resources they had: people, land, precious metals, and industries. Statistics was originally knowledge of the state and its resources, without any particularly quantitative bent or aspirations at insights, predictive or otherwise. From 1780, an explosion of counting took off, which Ian Hacking memorably described as “an avalanche of numbers.”12\n\n", "kinds": ["score"]}, {"note": "Makes me wonder what would the world look like without data. Is that possible, what would a short story about it look like."}, {"line": "This new, highly numerical statistics threatened the older ways of understanding rule and understanding people. Rather than basing the organization of the state upon the classics of political philosophy and using the history of states ancient and modern as guides, advocates of the new statistics focused on the quantitative descriptions of “land and people” relevant to guiding the ruler.", "kinds": ["score"]}]}, {"origin": "readwise", "head": "2 · Social Physics and l’homme moyen", "isExcerpt": false, "scan": "https://readwise.io/open/852249760", "scanLabel": "In Readwise ↗", "highlightId": 852249760, "sourceLocation": {"type": "offset", "value": 45917}, "highlightedAt": "2025-02-14T20:36:25.092262Z", "flow": [{"line": "As the accumulation of numbers accelerated, more and more facets of human lives were recorded in abstract numerical terms. From the start, governments, churches, and private statisticians tabulated numbers about deviance, death, crime, and sickness. Institutions new and old recorded details about the course of life and death, and—then as now—people running afoul of the law left traces. Statistical thinking from the 1700s onward rested fundamentally on the explosion of the collection of data about states, their people, and, quite often, people deemed to be deviant.\n\n", "kinds": ["score"]}, {"note": "Made me wonder how much of the British historical archive has been digitized so far."}, {"line": "This collecting of numbers was initially largely a descriptive affair, with scant calculation or mathematical work along the way.", "kinds": ["score"]}]}]}, {"id": "the-nowbrary", "title": "The Nowbrary", "author": "Moe", "openOnPassage": true, "contents": true, "contentsTitle": "About this booklet", "startLabel": "How it began", "titlePage": [["xs wide", "ABOUT THIS SHELF"], ["gap", ""], ["xl", "The Nowbrary"], ["m", "Moe"], ["rule", ""], ["s", "The books we keep near us."]], "link": {"href": "https://mapthewild.xyz/islands/nowbrary/", "label": "Read the essay ↗"}, "pages": [{"origin": "essay", "head": "How it began", "scan": "https://mapthewild.xyz/islands/nowbrary/", "scanLabel": "The essay ↗", "flow": [{"line": "A nowbrary is the books we keep near us. It's mostly offline.", "kinds": ["paragraph"]}, {"line": "On walks in my neighbourhood, with the luxurious real estate a baby stroller provides, I would actively curate my collection. Books that had remained in my home for too long, unread and collecting dust, or that I had simply outgrown, came along in the stroller and went into the little free libraries, which freed up space on my Ikea Kallax. While I was there, I would browse what other people had left.", "kinds": ["paragraph"]}, {"line": "The nowbrary initially started as a way for me to stop feeling guilty about collecting books. At some point I shifted from collecting physical books to a ballooning 2500+ digital library. Whenever I have a flight or train bound travel, I end up staring at a wall of my books agonizing about what to take before my eyes gravitate towards the ones I’ve already read. Or specifically, the ones that hold the most promise of teaching me something new. 9 out of ten, those books will probably be the ones that find themselves in my bag.", "kinds": ["paragraph"]}, {"line": "I don’t like what Goodreads has become. In 2013 it described its Reading Challenge like this: “We’ll let you know when you’re falling behind and when you’re out ahead!”", "kinds": ["paragraph"]}, {"line": "Mine isn’t a list of my best books, or of books I plan to read. It’s about a longitudinal relationship with a select number of books.", "kinds": ["paragraph"]}, {"line": "Books move in and out of the shelf like seasons. I like the idea that the shelf in any one season works as a life bookmark. Looking back at it would show me where I was at the time.", "kinds": ["paragraph"]}, {"line": "The “now” in the name comes from Derek Sivers’ /now page, which he added to his website in 2015 to say what he was focused on. The shelf can go online too. The nowbrary is not the /now or the /about page, but a page that hosts the books you’ll always have within reach.", "kinds": ["paragraph"]}]}, {"origin": "essay", "head": "Starting Your Nowbrary", "scan": "https://mapthewild.xyz/islands/nowbrary/", "scanLabel": "The essay ↗", "flow": [{"line": "How I decide what goes on my shelf, and what comes off it.", "kinds": ["paragraph"]}, {"line": "A nowbrary usually fits in one bookcase, like a 2x4 Ikea Kallax. If you’re committing to a number of books, you’re committing to physical copies, a bookcase limits you to what you can see.", "kinds": ["paragraph"]}, {"line": "So how do you go about building a nowbrary? I’m not about to tell you to dump all your books out Kondo style. I’ll share my considerations so change them to what works for you, and bonus, you can use it as a reason to keep looking at your shelf and swapping books out or maybe even dusting once in a while.", "kinds": ["paragraph"]}]}, {"origin": "essay", "head": "What goes on mine", "scan": "https://mapthewild.xyz/islands/nowbrary/", "scanLabel": "The essay ↗", "flow": [{"line": "Before a book goes on, I ask myself two things. Would I pack it for a flight or a long train ride? And have I read it before, and would I read it again?", "kinds": ["paragraph"]}]}, {"origin": "essay", "head": "What comes off mine", "scan": "https://littlefreelibrary.org/about/history/", "scanLabel": "Little Free Library ↗", "flow": [{"line": "Books come off when they’ve stayed unread and collecting dust, or when I’ve outgrown them. Little free libraries are a good place to take them. There are more than 200,000 of those boxes in 128 countries, so there may be one near you.", "kinds": ["paragraph"]}, {"line": "When a new book goes on the shelf, one usually has to come off to make room. A book you take off can go back on later. Maybe you gift it to a friend who you can reliably ask to return it when they’re done.", "kinds": ["paragraph"]}]}, {"origin": "essay", "head": "Sharing it", "scan": "https://nownownow.com/about", "scanLabel": "About /now pages ↗", "flow": [{"line": "I wanted to stay away from yet another login, so a nowbrary needs no app and no account. If you want to share yours, a page at /nowbrary on your website does it, the same way people keep a /now page. A photo of the shelf works too. Update it when the shelf changes.", "kinds": ["paragraph"]}, {"line": "I also consider a nowbrary a seasonal exercise, so if you take a snapshot every few months, in a few years you'll thank yourself for being able to recall that one book that had you think a certain thought, and maybe you'll dust it off or ask your friend to return it. This is assuming you want an excuse to talk to people. I know I do.", "kinds": ["paragraph"]}]}], "look": {"kind": "modern", "cloth": "#efe4cb", "ink": "#293d37"}}], "localEdition": true}</script>
